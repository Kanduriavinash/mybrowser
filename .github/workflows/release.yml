name: Build & Release MyBrowser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Required for electron-builder to create GitHub Releases

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & publish to GitHub Releases
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: MyBrowser-Windows-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
