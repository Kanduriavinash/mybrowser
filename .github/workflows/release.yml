name: Build & Release MyBrowser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify icon file
        shell: pwsh
        run: |
          if (Test-Path "assets/icons/icon.ico") {
            $len = (Get-Item "assets/icons/icon.ico").Length
            Write-Host "icon.ico found ($len bytes)"
          } else {
            throw "assets/icons/icon.ico is missing!"
          }

      - name: Build Electron app (Installer + Portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis portable --publish never

      - name: List built files
        shell: pwsh
        run: |
          Get-ChildItem dist/ | Where-Object { !$_.PSIsContainer } | Select-Object Name, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,1)}}

      - name: Create & Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") {
            $tag = "v" + (Get-Content package.json | ConvertFrom-Json).version
          }
          $files = @()
          $files += Get-ChildItem dist/ -Filter "*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem dist/ -Filter "*.blockmap" | Select-Object -ExpandProperty FullName
          if (Test-Path "dist/latest.yml") {
            $files += (Resolve-Path "dist/latest.yml").Path
          }

          # Delete existing release if present so we recreate cleanly and publicly
          gh release delete $tag --yes --repo ${{ github.repository }} 2>$null

          gh release create $tag @files `
            --repo ${{ github.repository }} `
            --title "MyBrowser $tag" `
            --generate-notes

      - name: Upload artifacts (backup copy in Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyBrowser-Windows-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
