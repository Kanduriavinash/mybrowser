name: Build & Release MyBrowser

on:
  push:
    tags:
      - 'v*'          # trigger on version tags like v1.0.0, v1.1.0
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Windows)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always

      - name: List dist output
        run: Get-ChildItem dist/ -Recurse | Where-Object { !$_.PSIsContainer } | Select-Object Name, Length

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: MyBrowser-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
          if-no-files-found: warn
